name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: persocart
          POSTGRES_USER: persocart
          POSTGRES_PASSWORD: persocart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persocart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: persocart
      POSTGRES_USER: persocart
      POSTGRES_PASSWORD: persocart
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy .

      - name: pytest
        run: pytest

  frontend:
    name: Frontend (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Vitest
        run: bun run test

  docker-build:
    name: Docker Build (production images)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          tags: persocart-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          tags: persocart-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  e2e:
    name: E2E (Playwright + axe-core)
    runs-on: ubuntu-latest
    needs: [docker-build]
    env:
      DJANGO_SECRET_KEY: ci-e2e-secret-key
      POSTGRES_DB: persocart
      POSTGRES_USER: persocart
      POSTGRES_PASSWORD: persocart
      DJANGO_ALLOWED_HOSTS: localhost,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Start full stack
        run: |
          cp .env.example .env
          echo "DJANGO_SECRET_KEY=ci-e2e-secret-key" >> .env
          echo "DJANGO_ALLOWED_HOSTS=localhost,backend" >> .env
          echo "DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost" >> .env
          docker compose up -d --build
          docker compose run --rm backend python manage.py migrate

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz/ && break
            echo "Waiting for backend... ($i)"
            sleep 2
          done

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5173
        run: bunx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Stop stack
        if: always()
        run: docker compose down -v
