# Development stack. Production compose is added in Phase 5 (docker-compose.prod.yml).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-persocart}
      POSTGRES_USER: ${POSTGRES_USER:-persocart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-persocart}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a version-specific subdir; mount the
      # parent dir (not /data) per docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-persocart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      POSTGRES_DB: ${POSTGRES_DB:-persocart}
      POSTGRES_USER: ${POSTGRES_USER:-persocart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-persocart}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
