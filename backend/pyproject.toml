# Tooling configuration only; runtime deps live in requirements*.txt
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear, django

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Core strict checks without disallow_any_generics — Django admin/MPTT have untyped generics
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# imagekit, mptt, django-filter ship without stubs
disable_error_code = ["import-untyped"]
exclude = ['migrations/']

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"
testpaths = ["tests"]
